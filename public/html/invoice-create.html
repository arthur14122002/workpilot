<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>WorkPilot – Neue Rechnung</title>

<link rel="stylesheet" href="/css/app-layout.css" />
<link rel="stylesheet" href="/css/invoice-create.css" />
<link rel="stylesheet" href="/css/wp-design-final.css" />
<link rel="stylesheet" href="/css/wp-contacts-v3.css" />
</head>
<body>
<div class="appShell">
<aside class="sidebar">
<div>
<div class="logoWrap">
<div class="logoBox">WP</div>
<div class="logoText">WorkPilot</div>
</div>

<nav class="navGroup">
<a class="navLink" href="/"><span class="wpNavIcon" data-icon="layout-dashboard" aria-hidden="true"></span><span class="wpNavText">Dashboard</span></a>
<a class="navLink" href="/contacts"><span class="wpNavIcon" data-icon="users" aria-hidden="true"></span><span class="wpNavText">Kontakte</span></a>
<a class="navLink" href="/offers"><span class="wpNavIcon" data-icon="file-text" aria-hidden="true"></span><span class="wpNavText">Angebote</span></a>
<a class="navLink" href="/invoices"><span class="wpNavIcon" data-icon="receipt" aria-hidden="true"></span><span class="wpNavText">Rechnungen</span></a>
<a class="navLink" href="/emails">
<span class="wpNavIcon" data-icon="mail" aria-hidden="true"></span><span class="wpNavText">E-Mails</span>
<span id="emailCounter" class="navCounter" style="display:none;">0</span>
</a>
<a class="navLink" href="/settings"><span class="wpNavIcon" data-icon="settings" aria-hidden="true"></span><span class="wpNavText">Profil</span></a>
</nav>
</div>

<div class="sidebarBottom">
<a class="navLink" href="/login"><span class="wpNavIcon" data-icon="log-in" aria-hidden="true"></span><span class="wpNavText">Anmelden</span></a>
</div>
</aside>

<main class="content">
<header class="pageHeader">
<div class="pageEyebrow">Rechnung erstellen</div>
<h1 class="pageTitle">Neue Rechnung vorbereiten</h1>
<p class="pageSubtitle">
Gib Empfänger und Leistungen ein. WorkPilot erstellt daraus eine Rechnung.
</p>
</header>

<section class="card createCard">
<form id="invoiceCreateForm">
<div class="formGrid">
<div class="formField">
<label for="recipientName">Empfänger / Kunde</label>
<input id="recipientName" placeholder="Max Mustermann" required />
</div>

<div class="formField">
<label for="recipientEmail">E-Mail des Kunden</label>
<input id="recipientEmail" placeholder="kunde@email.de" />
</div>

<div class="formField">
<label for="recipientStreet">Straße</label>
<input id="recipientStreet" placeholder="Musterstraße 123" />
</div>

<div class="formField">
<label for="recipientCity">PLZ / Ort</label>
<input id="recipientCity" placeholder="12345 Berlin" />
</div>

<div class="formField">
<label for="dueDays">Fälligkeit</label>
<select id="dueDays">
<option value="7">7 Tage</option>
<option value="14" selected>14 Tage</option>
<option value="30">30 Tage</option>
</select>
</div>

<div class="formField">
<label for="serviceDateType">Art der Leistungserbringung</label>
<select id="serviceDateType">
    <option value="date">Einzelnes Leistungsdatum</option>
    <option value="period">Leistungszeitraum</option>
</select>

<div id="serviceDateSingle">
    <label for="serviceDate">Leistungsdatum</label>
    <input id="serviceDate" type="date" />
</div>

<div id="serviceDatePeriod" style="display: none;">
    <label for="servicePeriodStart">Von</label>
    <input id="servicePeriodStart" type="date" />

    <label for="servicePeriodEnd">Bis</label>
    <input id="servicePeriodEnd" type="date" />
</div>
</div>

<div class="formField full">
<label>Rechnungspositionen</label>

<div id="invoicePoints"></div>

<button type="button" class="btn btnSecondary addPointBtn" id="addInvoicePointBtn">
+ Position hinzufügen
</button>
</div>
</div>

<div class="buttonRow">
<a class="btn btnSecondary" href="/invoices" style="text-decoration:none;">Abbrechen</a>
<button type="submit" class="btn btnPrimary">Rechnung erstellen</button>
</div>
</form>
</section>
</main>
</div>

<script src="/js/wp-icons.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/invoice-create.js"></script>
</body>
</html>
