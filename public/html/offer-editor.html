<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WorkPilot – Angebot bearbeiten</title>

<link rel="stylesheet" href="/css/app-layout.css" />
<link rel="stylesheet" href="/css/offer-editor.css" />
<link rel="stylesheet" href="/css/wp-design-final.css" />
<link rel="stylesheet" href="/css/wp-contacts-v3.css" />
<link rel="stylesheet" href="/css/wp-offer-upgrade.css" />
</head>
<body>
<div class="appShell">
<aside class="sidebar">
<div>
<div class="logoWrap">
<img class="wpBrandSymbol" src="/assets/workpilot-w.svg" alt="" />
<div class="wpBrandCopy"><div class="logoText">WorkPilot</div><div class="wpBrandTagline">DEIN BUSINESS. EIN SYSTEM.</div></div>
</div>

<nav class="navGroup">
<a class="navLink" href="/"><span class="wpNavIcon" data-icon="layout-dashboard" aria-hidden="true"></span><span class="wpNavText">Dashboard</span></a>
<a class="navLink" href="/contacts"><span class="wpNavIcon" data-icon="users" aria-hidden="true"></span><span class="wpNavText">Kontakte</span></a>
<a class="navLink" href="/offers"><span class="wpNavIcon" data-icon="file-text" aria-hidden="true"></span><span class="wpNavText">Angebote</span></a>
<a class="navLink" href="/invoices"><span class="wpNavIcon" data-icon="receipt" aria-hidden="true"></span><span class="wpNavText">Rechnungen</span></a>
<a class="navLink" href="/emails">
<span class="wpNavIcon" data-icon="mail" aria-hidden="true"></span><span class="wpNavText">E-Mails</span>
<span id="emailCounter" class="navCounter" style="display:none;">0</span>
</a>
<a class="navLink" href="/settings"><span class="wpNavIcon" data-icon="settings" aria-hidden="true"></span><span class="wpNavText">Profil</span></a>
</nav>
</div>

<div class="sidebarBottom">
<a class="navLink" href="/login"><span class="wpNavIcon" data-icon="log-in" aria-hidden="true"></span><span class="wpNavText">Anmelden</span></a>
</div>
</aside>

<main class="content">
<header class="pageHeader">
<div class="pageEyebrow">Angebot bearbeiten</div>
<h1 class="pageTitle">Angebotsvorschau</h1>
<p class="pageSubtitle">
Prüfe den Text und trage Menge, Einheitspreis und Positionen ein.
</p>
</header>

<div class="editorActions">
<a class="btn btnSecondary" href="/offer-create">Zurück</a>
<button class="btn btnSecondary" id="addPositionBtn">Position hinzufügen</button>
<button class="btn btnSecondary" id="exportCsvBtn" type="button">Positionen als CSV</button>
<button class="btn btnSecondary" id="printBtn">Drucken / PDF</button>
<button class="btn btnPrimary" id="saveOfferBtn">Speichern</button>
<button class="btn btnPrimary" id="convertToInvoiceBtn">
In Rechnung umwandeln
</button>
</div>

<div class="wpOfferToolbar"><label for="offerTemplateSelect">Dokumentvorlage <select id="offerTemplateSelect"><option value="modern">Modern</option><option value="classic">Klassisch</option><option value="compact">Kompakt</option></select></label></div>
<div id="offerDocument" class="offerDocument"></div>

<div class="notice" id="editorNotice">Angebot wurde gespeichert.</div>
</main>
</div>

<script src="/js/wp-icons.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/offer-editor.js"></script>
</body>
</html>
