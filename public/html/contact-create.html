<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>WorkPilot – Kontakt erstellen</title>

<link rel="stylesheet" href="/css/app-layout.css" />
<link rel="stylesheet" href="/css/contact-create.css" />
<link rel="stylesheet" href="/css/wp-design-final.css" />
<link rel="stylesheet" href="/css/wp-contacts-v3.css" />
</head>
<body>
<div class="appShell">
<aside class="sidebar">
<div>
<div class="logoWrap">
<div class="logoBox">WP</div>
<div class="logoText">WorkPilot</div>
</div>

<nav class="navGroup">
<a class="navLink" href="/"><span class="wpNavIcon" data-icon="layout-dashboard" aria-hidden="true"></span><span class="wpNavText">Dashboard</span></a>
<a class="navLink" href="/contacts"><span class="wpNavIcon" data-icon="users" aria-hidden="true"></span><span class="wpNavText">Kontakte</span></a>
<a class="navLink" href="/offers"><span class="wpNavIcon" data-icon="file-text" aria-hidden="true"></span><span class="wpNavText">Angebote</span></a>
<a class="navLink" href="/invoices"><span class="wpNavIcon" data-icon="receipt" aria-hidden="true"></span><span class="wpNavText">Rechnungen</span></a>
<a class="navLink" href="/emails">
<span class="wpNavIcon" data-icon="mail" aria-hidden="true"></span><span class="wpNavText">E-Mails</span>
<span id="emailCounter" class="navCounter" style="display:none;">0</span>
</a>
<a class="navLink" href="/settings"><span class="wpNavIcon" data-icon="settings" aria-hidden="true"></span><span class="wpNavText">Profil</span></a>
</nav>
</div>

<div class="sidebarBottom">
<a class="navLink" href="/login"><span class="wpNavIcon" data-icon="log-in" aria-hidden="true"></span><span class="wpNavText">Anmelden</span></a>
</div>
</aside>

<main class="content">
<header class="pageHeader">
<div class="pageEyebrow">Kontakt</div>
<h1 class="pageTitle" id="pageTitle">Kontakt erstellen</h1>
<p class="pageSubtitle">
Lege einen neuen Kundenkontakt an oder bearbeite bestehende Kontaktdaten.
</p>
</header>

<section class="card createCard contactCreateCard">
<form id="contactCreateForm" class="contactForm">
<div class="formGrid"><div class="formField"><label for="contactType">Kontaktart</label><select id="contactType" aria-label="Kontaktart"><option value="person">Privatkontakt</option><option value="company">Firmenkontakt</option></select></div>
<div class="formField">
<label for="contactName">Name / Firma</label>
<input id="contactName" placeholder="Muster GmbH" required />
</div>

<div class="formField">
<label for="contactEmail">E-Mail</label>
<input id="contactEmail" placeholder="kunde@email.de" />
</div>

<div class="formField">
<label for="contactPhone">Telefon</label>
<input id="contactPhone" placeholder="+49 123 456789" />
</div>

<div class="formField">
<label for="contactStreet">Straße</label>
<input id="contactStreet" placeholder="Musterstraße 123" />
</div>

<div class="formField">
<label for="contactCity">PLZ / Ort</label>
<input id="contactCity" placeholder="12345 Berlin" />
</div>
</div>

<div class="buttonRow">
<a class="btn btnSecondary" href="/contacts">Abbrechen</a>

<button class="btn btnPrimary" type="submit" id="saveContactBtn">
Kontakt speichern
</button>
</div>
</form>
</section>
</main>
</div>

<script src="/js/wp-icons.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/contact-create.js"></script>
</body>
</html>
