<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>WorkPilot – Termin erstellen</title>

<link rel="stylesheet" href="/css/app-layout.css" />
<link rel="stylesheet" href="/css/calendar-create.css" />
<link rel="stylesheet" href="/css/wp-design-final.css" />
<link rel="stylesheet" href="/css/wp-contacts-v3.css" />
</head>
<body>
<div class="appShell">
<aside class="sidebar">
<div>
<div class="logoWrap">
<div class="logoBox">WP</div>
<div class="logoText">WorkPilot</div>
</div>

<nav class="navGroup">
<a class="navLink" href="/"><span class="wpNavIcon" data-icon="layout-dashboard" aria-hidden="true"></span><span class="wpNavText">Dashboard</span></a>
<a class="navLink" href="/contacts"><span class="wpNavIcon" data-icon="users" aria-hidden="true"></span><span class="wpNavText">Kontakte</span></a>
<a class="navLink" href="/offers"><span class="wpNavIcon" data-icon="file-text" aria-hidden="true"></span><span class="wpNavText">Angebote</span></a>
<a class="navLink" href="/invoices"><span class="wpNavIcon" data-icon="receipt" aria-hidden="true"></span><span class="wpNavText">Rechnungen</span></a>
<a class="navLink" href="/emails">
<span class="wpNavIcon" data-icon="mail" aria-hidden="true"></span><span class="wpNavText">E-Mails</span>
<span id="emailCounter" class="navCounter" style="display:none;">0</span>
</a>
<a class="navLink" href="/settings"><span class="wpNavIcon" data-icon="settings" aria-hidden="true"></span><span class="wpNavText">Profil</span></a>
</nav>
</div>

<div class="sidebarBottom">
<a class="navLink" href="/login"><span class="wpNavIcon" data-icon="log-in" aria-hidden="true"></span><span class="wpNavText">Anmelden</span></a>
</div>
</aside>

<main class="content">
<header class="pageHeader">
<div class="pageEyebrow">Kalender</div>
<h1 class="pageTitle">Termin erstellen</h1>
<p class="pageSubtitle">
Lege Termine, Erinnerungen, Rückrufe oder Follow-ups für deinen Arbeitsalltag an.
</p>
</header>

<section class="card calendarCreateCard">
<form id="calendarEventForm">
<div class="formGrid">

<div class="formField full">
<label for="title">Titel *</label>
<input id="title" name="title" placeholder="z. B. Rückruf Herr Müller" required />
</div>

<div class="formField">
<label for="eventDate">Datum *</label>
<input id="eventDate" name="eventDate" type="date" required />
</div>

<div class="formField">
<label for="eventTime">Uhrzeit</label>
<input id="eventTime" name="eventTime" type="time" />
</div>

<div class="formField full">
<label for="contactId">Kontakt zuordnen (optional)</label>
<select id="contactId" name="contactId"><option value="">Kein Kontakt</option></select>
</div>

<div class="formField full">
<label for="description">Beschreibung</label>
<textarea id="description" name="description" placeholder="Notizen zum Termin..."></textarea>
</div>

<div class="formField full">
<label>Farbe</label>

<div class="calendarColorPicker">
<button type="button" class="calendarColorOption active" data-color="orange"></button>
<button type="button" class="calendarColorOption blue" data-color="blue"></button>
<button type="button" class="calendarColorOption green" data-color="green"></button>
<button type="button" class="calendarColorOption purple" data-color="purple"></button>
<button type="button" class="calendarColorOption red" data-color="red"></button>
<button type="button" class="calendarColorOption yellow" data-color="yellow"></button>
</div>
</div>

</div>

<div class="buttonRow">
<a class="btn btnSecondary" href="/">Abbrechen</a>
<button type="button" class="btn btnSecondary" id="deleteCalendarEventBtn">
Termin löschen
</button>
<button class="btn btnPrimary" type="submit">Termin aktualisieren</button>
</div>

</form>
</section>
</main>
</div>

<script src="/js/wp-icons.js"></script>
<script src="/js/app-layout.js"></script>
<script src="/js/calendar-edit.js"></script>
</body>
</html>
