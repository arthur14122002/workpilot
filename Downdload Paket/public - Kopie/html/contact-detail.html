<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkPilot – Kontaktdetails</title>
  <link rel="stylesheet" href="/css/login.css">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f8ff; font-family: system-ui, sans-serif; color: #172b4d; }
    main { width: min(440px, calc(100% - 48px)); padding: 36px; border-radius: 18px; background: white; box-shadow: 0 12px 40px rgba(28, 59, 110, .09); text-align: center; }
    h1 { margin: 0 0 14px; font-size: 26px; }
    p { line-height: 1.6; color: #51627c; }
    a { display: inline-block; margin-top: 16px; padding: 12px 22px; border-radius: 10px; background: #2563eb; color: white; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Kontaktdetails werden überarbeitet</h1>
    <p>Diese Ansicht ist vorübergehend nicht verfügbar. Deine gespeicherten Kontakte werden dadurch nicht gelöscht.</p>
    <a href="/contacts">Zur Kontaktübersicht</a>
  </main>
</body>
</html>
